name: Generar APK En Linea

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Gradle manualmente
        uses: gradle/actions/setup-gradle@v4

      - name: Generar archivos Gradle faltantes
        run: gradle wrapper

      - name: Dar permisos de ejecucion a Gradle
        run: chmod +x gradlew

      - name: Compilar APK de Depuracion (Debug)
        run: ./gradlew assembleDebug

      - name: Guardar y empaquetar archivo APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk


