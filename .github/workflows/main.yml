name: Generar APK En Linea

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Detectar estructura y Generar Gradle Completo
        run: |
          MODULE_DIR=$(dirname $(find . -name "AndroidManifest.xml" | head -n 1) | sed 's|\./||' | cut -d'/' -f1)
          if [ -z "$MODULE_DIR" ] || [ "$MODULE_DIR" = "." ]; then
            MODULE_DIR="."
          fi
          echo "Modulo detectado: $MODULE_DIR"
          echo "MODULE_NAME=$MODULE_DIR" >> $GITHUB_ENV
          
          # Crear settings.gradle con repositorios de plugins obligatorios
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF
          
          if [ "$MODULE_DIR" != "." ]; then
            echo "include ':$MODULE_DIR'" >> settings.gradle
            echo "plugins { id 'com.android.application' version '8.2.0' apply false }" > build.gradle
          else
            echo "plugins { id 'com.android.application' version '8.2.0' }" > build.gradle
          fi

      - name: Instalar Gradle manualmente
        uses: gradle/actions/setup-gradle@v4

      - name: Generar Wrapper
        run: gradle wrapper

      - name: Dar permisos de ejecucion
        run: chmod +x gradlew

      - name: Compilar APK Dinamico
        run: |
          if [ "$MODULE_NAME" = "." ]; then
            ./gradlew assembleDebug
          else
            ./gradlew :$MODULE_NAME:assembleDebug
          fi

      - name: Guardar y empaquetar archivo APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"


